name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Intel image still defaults to Xcode 16 / Swift 6.1.
          - os: macos-15-intel
            developer-directory: /Applications/Xcode_26.3.app/Contents/Developer
          - os: macos-latest
            developer-directory: /Applications/Xcode.app/Contents/Developer
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer-directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: ./scripts/test.sh
      - name: Release safety tests
        run: python3 -m unittest discover -s Tests/ReleaseTests
      - uses: actions/cache@v4
        with:
          path: .build/intel-runtime
          key: swift-6.2-intel-runtime-9eac4a13500c-${{ matrix.os }}
      - name: Prepare missing Intel runtime archives
        shell: zsh {0}
        run: |
          swift_binary="$(xcrun --find swiftc)"
          archive="${swift_binary:h:h}/lib/swift/macosx/libswiftCompatibility56.a"
          if [[ "$(lipo -archs "$archive")" != *x86_64* && ! -f .build/intel-runtime/macosx/libswiftCompatibility56.a ]]; then
            ./scripts/prepare-intel-runtime.sh
          fi
      - name: Universal app
        run: ./scripts/build.sh --universal
      - name: Package and verify distribution
        run: ./scripts/package-release.sh
      - name: Reject ad-hoc signatures for public distribution
        shell: zsh {0}
        run: |
          if ./scripts/verify-release.sh --distribution > .build/distribution-check.log 2>&1; then
            cat .build/distribution-check.log
            print -u2 "A local CI signature must not pass Developer ID verification."
            exit 1
          fi
          # Reject the actual signature, rather than accepting a broken verifier.
          rg -q 'code failed to satisfy specified code requirement' .build/distribution-check.log
      - uses: actions/upload-artifact@v4
        with:
          name: Mica-universal-${{ matrix.os }}
          # ZIP preserves executable bits and the app bundle structure.
          path: dist/Mica-*
